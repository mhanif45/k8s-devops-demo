<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s DevOps Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .author {
            color: #e2e8f0;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }
        .status {
            display: inline-block;
            background-color: #22c55e;
            color: #052e16;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Kubernetes GitOps Pipeline</h1>
        <p>Custom NGINX Deployment powered by GitHub Actions & Helm.</p>
        <div class="author">Architected & Engineered by: <strong>Muhammad Hanif</strong></div>
        <div class="status">● Automated CD Active</div>
    </div>
</body>
</html>
