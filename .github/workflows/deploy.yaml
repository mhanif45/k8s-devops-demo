name: Deploy NGINX to Kubernetes Cluster

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Cluster Connection
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Deploy or Upgrade NGINX via Helm
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm upgrade --install my-web bitnami/nginx

    - name: Ensure NodePort Service
      run: |
        kubectl patch svc my-web-nginx -p '{"spec": {"type": "NodePort"}}'
        kubectl get svc my-web-nginx
