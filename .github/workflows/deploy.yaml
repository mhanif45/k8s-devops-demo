name: Build and Deploy Custom Container Image

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKHUB_DEVOPS }}
        password: ${{ secrets.DOCKHUB_DEVOPS2 }}

    - name: Build and Push Docker Image
      run: |
        docker build -t hanif040/k8s-demo:${{ github.sha }} .
        docker push hanif040/k8s-demo:${{ github.sha }}

    - name: Deploy to Kubernetes via Manifests
      run: |
        sed -i "s/IMAGE_TAG/${{ github.sha }}/g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
